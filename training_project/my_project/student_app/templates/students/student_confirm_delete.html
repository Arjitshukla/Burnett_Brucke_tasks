
<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
</head>
<body>

<h1>Confirm Student Deletion</h1>

<p>Are you sure you want to delete this student?</p>

<h3>{{ student.name }}</h3>
<p>{{ student.email }}</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'student_detail' student.pk %}">
    Cancel
</a>

</body>
</html>
