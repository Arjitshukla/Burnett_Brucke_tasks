
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Training Portal</title>
</head>
<body>

    <nav>
        <a href="{% url 'dashboard' %}">Dashboard</a> |
        <a href="{% url 'student_list' %}">Students</a> |
        <a href="{% url 'add_student' %}">Add Student</a> |
        <a href="{% url 'logout' %}">Logout</a>
    </nav>

    <hr>

    <!-- Django Messages -->
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <!-- Child Template Content -->
    {% block content %}
    {% endblock %}

</body>
</html>
