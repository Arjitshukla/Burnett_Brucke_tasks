<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" 
    {% block title %}Student Training Portal{% endblock %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %} {% endblock %}
  </head>
  <body>
    <!-- Navbar -->
    {% include 'students/includes/navbar.html' %}

    <hr />
     <!-- Django Messages -->
    {% include 'students/includes/messages.html' %}

    <!-- Child Template Content -->
    <!-- Main Content -->
    <main class="container mt-4">{% block content %} {% endblock %}</main>

    <!-- Footer -->
    <footer class="text-center mt-5 py-3 bg-light">
      <p class="mb-0">Student Training Portal | Django Training Day 4</p>
    </footer>

    <!-- Bootstrap JavaScript -->

    <script
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    ></script>

    {% block extra_js %} {% endblock %}
  </body>
</html>
